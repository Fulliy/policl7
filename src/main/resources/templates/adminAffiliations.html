<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: portalPage('Управление прикреплениями', 'affiliations', ~{::content})}">
<body><main th:fragment="content" class="space-y-6">
    <header><p class="text-sm font-semibold text-clinic-700">РЕГИСТРАТУРА</p><h1 class="mt-2 text-3xl font-bold text-ink">Прикрепления пациентов</h1><p class="mt-2 text-slate-600">Добавление и удаление официальных записей о прикреплении.</p></header>
    <section class="rounded-2xl border border-slate-200 bg-white p-5 shadow-card"><h2 class="text-xl font-bold text-ink">Добавить прикрепление</h2><form method="post" th:action="@{/admin/patient-affiliations}" class="mt-4 grid gap-4 sm:grid-cols-2"><label class="text-sm font-semibold">Пациент<select name="patientId" required class="mt-1 w-full rounded-xl border p-3"><option value="">Выберите пациента</option><option th:each="patient : ${patients}" th:value="${patient.idUser}" th:text="${patient.displayName}"></option></select></label><label class="text-sm font-semibold">Медцентр<input name="medicalCenterName" required maxlength="200" class="mt-1 w-full rounded-xl border p-3"></label><label class="text-sm font-semibold">Врач<input name="doctorName" required maxlength="150" class="mt-1 w-full rounded-xl border p-3"></label><label class="text-sm font-semibold">Дата<input name="attachedAt" type="date" required class="mt-1 w-full rounded-xl border p-3"></label><label class="text-sm font-semibold">Статус<select name="status" class="mt-1 w-full rounded-xl border p-3"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status == T(com.example.medicalsystem.model.PatientAffiliation.AffiliationStatus).ACTIVE ? 'Активно' : 'Завершено'}"></option></select></label><button class="rounded-xl bg-clinic-500 px-5 py-3 font-semibold text-white sm:col-span-2">Сохранить</button></form></section>
    <section class="divide-y rounded-2xl border border-slate-200 bg-white px-5 shadow-card"><article th:each="item : ${affiliations}" class="flex flex-wrap items-center justify-between gap-4 py-4"><div><h2 class="font-semibold text-ink" th:text="${item.patient.displayName + ' · ' + item.medicalCenterName}">Пациент · Центр</h2><p class="mt-1 text-sm text-slate-600" th:text="${item.doctorName + ' · ' + #temporals.format(item.attachedAt, 'dd.MM.yyyy')}">Врач · дата</p></div><form method="post" th:action="@{/admin/patient-affiliations/{id}/delete(id=${item.idAffiliation})}"><button class="rounded-lg border border-rose-200 px-3 py-2 text-sm font-semibold text-rose-700">Удалить</button></form></article><p th:if="${affiliations.isEmpty()}" class="py-8 text-center text-slate-600">Прикреплений пока нет.</p></section>
</main></body></html>
