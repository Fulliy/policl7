<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: portalPage('Управление прикреплениями', 'affiliations', ~{::content})}">
<body><main th:fragment="content" class="affiliation-admin-page space-y-7">
<style>.affiliation-admin-page{--a-ink:#163640;--a-muted:#60777b;--a-line:#dcebe7;--a-mint:#edf8f5;--a-teal:#087f79}.affiliation-hero{padding:28px 32px;border-radius:25px;color:#fff;background:#163e48;box-shadow:0 18px 42px #163e4826}.affiliation-hero h1{margin:0;color:#fff!important;font-size:clamp(2rem,4vw,3rem);line-height:1.05}.affiliation-hero p{margin:10px 0 0;color:#d5e9e4}.affiliation-panel{padding:23px;border:1px solid var(--a-line);border-radius:21px;background:#fff;box-shadow:0 10px 27px #163e480d}.affiliation-panel h2{margin:0;color:var(--a-ink)!important;font-size:20px}.affiliation-panel>p{margin:6px 0 18px;color:var(--a-muted);font-size:13px}.affiliation-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.affiliation-fields label{color:#284e55;font-size:13px;font-weight:700}.affiliation-fields input,.affiliation-fields select{width:100%;min-height:45px;margin-top:5px;padding:10px 12px;border:1px solid #cfe2df;border-radius:10px;font:inherit}.affiliation-fields .wide{grid-column:1/-1}.affiliation-save{min-height:47px;border:0;border-radius:11px;color:#fff;background:var(--a-teal);font:inherit;font-weight:800;cursor:pointer}.affiliation-list{display:grid;gap:10px;margin-top:18px}.affiliation-row{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:15px;border:1px solid var(--a-line);border-radius:14px;background:#fbfefd}.affiliation-row h3{margin:0;color:var(--a-ink);font-size:14px}.affiliation-row p{margin:5px 0 0;color:var(--a-muted);font-size:12px}.affiliation-delete{min-height:40px;padding:9px 13px;border:1px solid #edc9c9;border-radius:9px;color:#a0444c;background:#fff;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.affiliation-search{width:100%;min-height:45px;margin-top:13px;padding:10px 12px;border:1px solid #cfe2df;border-radius:10px;font:inherit}@media(max-width:650px){.affiliation-fields{grid-template-columns:1fr}.affiliation-fields .wide{grid-column:auto}.affiliation-hero{padding:24px 21px}.affiliation-row{align-items:stretch;flex-direction:column}}
</style>
<section class="affiliation-hero"><h1>Прикрепления пациентов</h1><p>Выберите пациента, филиал и врача из справочников. Форма не создаёт свободных дублей в именах.</p></section>
<section class="affiliation-panel"><h2>Добавить прикрепление</h2><p>Поиск по списку пациента можно использовать, если пациентов много.</p><form method="post" th:action="@{/admin/patient-affiliations}" class="affiliation-fields"><label>Пациент<select name="patientId" required><option value="">Выберите пациента</option><option th:each="patient : ${patients}" th:value="${patient.idUser}" th:text="${patient.displayName + (patient.email != null ? ' · ' + patient.email : '')}"></option></select></label><label>Медцентр<select name="branchId" required><option value="">Выберите филиал</option><option th:each="branch : ${branches}" th:value="${branch.id}" th:text="${branch.name + ' — ' + branch.address}"></option></select></label><label>Врач (необязательно)<select name="doctorId"><option value="">Выберите врача</option><option th:each="doctor : ${doctors}" th:value="${doctor.idUser}" th:text="${doctor.displayName + (doctor.specialty != null ? ' · ' + doctor.specialty.specialtyName : '')}"></option></select></label><label>Дата прикрепления<input name="attachedAt" type="date" required></label><label>Статус<select name="status"><option th:each="status : ${statuses}" th:value="${status}" th:text="${status == T(com.example.medicalsystem.model.PatientAffiliation.AffiliationStatus).ACTIVE ? 'Активно' : 'Завершено'}"></option></select></label><button class="affiliation-save wide" type="submit">Сохранить прикрепление</button></form></section>
<section class="affiliation-panel"><h2>Существующие прикрепления</h2><input class="affiliation-search" type="search" data-affiliation-search placeholder="Поиск пациента, филиала или врача"><div class="affiliation-list" id="affiliationList"><article th:each="item : ${affiliations}" class="affiliation-row" data-affiliation-row th:attr="data-affiliation-text=${item.patient.displayName + ' ' + item.medicalCenterName + ' ' + item.doctorName}"><div><h3 th:text="${item.patient.displayName + ' · ' + item.medicalCenterName}">Пациент · Филиал</h3><p th:text="${(item.doctorName != null and !item.doctorName.isBlank() ? item.doctorName + ' · ' : '') + #temporals.format(item.attachedAt, 'dd.MM.yyyy') + ' · ' + (item.status.name() == 'ACTIVE' ? 'Активно' : 'Завершено')}">Дата · статус</p></div><form method="post" th:action="@{/admin/patient-affiliations/{id}/delete(id=${item.idAffiliation})}"><button class="affiliation-delete" type="submit">Удалить</button></form></article><p th:if="${affiliations.isEmpty()}" class="py-8 text-center text-sm text-slate-500">Прикреплений пока нет.</p></div></section>
<script>(()=>{const search=document.querySelector('[data-affiliation-search]');search?.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase('ru');document.querySelectorAll('[data-affiliation-row]').forEach(row=>row.hidden=!row.dataset.affiliationText.toLocaleLowerCase('ru').includes(q));});})();</script>
</main></body></html>
