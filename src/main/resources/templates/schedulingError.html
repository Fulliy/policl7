<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Не удалось выполнить действие</title>
    <link rel="stylesheet" href="/app.css">
</head>
<body class="min-h-screen bg-slate-50 px-5 py-12">
<main class="mx-auto max-w-xl rounded-2xl border border-rose-100 bg-white p-8 text-center shadow-sm">
    <h1 class="text-xl font-semibold text-slate-800">Не удалось выполнить действие</h1>
    <p class="mt-3 text-sm text-slate-600" th:text="${message}">Проверьте выбранное время.</p>
    <a href="/appointments" class="mt-6 inline-flex rounded-xl bg-clinic-600 px-5 py-3 font-semibold text-white hover:bg-clinic-700">Вернуться к записям</a>
</main>
</body>
</html>
