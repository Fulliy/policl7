<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: portalPage('Реестр пациентов и врачей', 'admin-registry', ~{::content})}">
<body><main th:fragment="content" class="admin-registry-page space-y-7">
<style>
.admin-registry-page{--r-ink:#163640;--r-muted:#60777b;--r-line:#dcebe7;--r-mint:#edf8f5;--r-teal:#087f79}.registry-hero{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:30px 34px;border-radius:26px;color:#fff;background:#163e48;box-shadow:0 18px 42px #163e4826}.registry-hero h1{margin:0;color:#fff!important;font-size:clamp(2rem,4vw,3rem);line-height:1.05;letter-spacing:-.045em}.registry-hero p{margin:11px 0 0;color:#d5e9e4}.registry-stats{display:flex;gap:8px;flex-wrap:wrap}.registry-stat{min-width:100px;padding:12px 13px;border:1px solid #ffffff2b;border-radius:13px;background:#ffffff12}.registry-stat strong{display:block;font-size:22px}.registry-stat span{display:block;margin-top:3px;color:#b7ddd6;font-size:12px}.registry-tabs{display:flex;gap:5px;width:max-content;padding:4px;border-radius:12px;background:#eaf4f2}.registry-tab{min-height:46px;padding:11px 18px;border:0;border-radius:9px;color:#5d7477;background:transparent;font:inherit;font-size:13px;font-weight:700;cursor:pointer}.registry-tab[data-selected=true]{color:var(--r-teal);background:#fff;box-shadow:0 4px 12px #163e4814}.registry-panel{padding:22px;border:1px solid var(--r-line);border-radius:21px;background:#fff;box-shadow:0 10px 27px #163e480d}.registry-panel h2{margin:0;color:var(--r-ink)!important;font-size:20px}.registry-panel p{margin:5px 0 18px;color:var(--r-muted);font-size:13px}.registry-list{display:grid;gap:10px}.registry-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:15px;align-items:center;padding:16px;border:1px solid var(--r-line);border-radius:15px;background:#fbfefd}.registry-avatar{display:grid;width:44px;height:44px;place-items:center;border-radius:13px;color:var(--r-teal);background:var(--r-mint);font-weight:800}.registry-row h3{margin:0;color:var(--r-ink);font-size:15px}.registry-row p{margin:5px 0 0;color:var(--r-muted);font-size:12px}.registry-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.registry-tag{padding:4px 8px;border-radius:7px;color:#4e7773;background:var(--r-mint);font-size:11px}.registry-open{min-height:46px;display:inline-flex;align-items:center;padding:10px 16px;border-radius:9px;color:#fff;background:var(--r-teal);font-size:12px;font-weight:800;text-decoration:none;white-space:nowrap}.registry-empty{padding:30px;border:1px dashed #b8d7d1;border-radius:14px;color:var(--r-muted);text-align:center}@media(max-width:700px){.registry-hero{align-items:start;flex-direction:column;padding:24px 21px}.registry-row{grid-template-columns:auto minmax(0,1fr)}.registry-open{grid-column:1/-1;text-align:center}}
</style>
<section class="registry-hero"><div><h1>Реестр пациентов и врачей</h1></div><div class="registry-stats"><div class="registry-stat"><strong th:text="${patientCount}">0</strong><span>пациентов</span></div><div class="registry-stat"><strong th:text="${doctorCount}">0</strong><span>врачей</span></div><div class="registry-stat"><strong th:text="${appointmentCount}">0</strong><span>приёмов</span></div></div></section>
<div class="registry-tabs" role="tablist"><button class="registry-tab" data-tab="patients" data-selected="true">Пациенты</button><button class="registry-tab" data-tab="doctors" data-selected="false">Врачи</button></div>
<section id="patients" class="registry-panel" data-panel><h2>Пациенты</h2><div class="registry-list"><article th:each="row : ${patients}" class="registry-row"><span class="registry-avatar" th:text="${#strings.substring(row.patient.firstName,0,1)+#strings.substring(row.patient.surname,0,1)}">АП</span><div><h3 th:text="${row.patient.displayName}">Пациент</h3><p th:text="${row.lastVisit() != null ? 'Последний визит: ' + #temporals.format(row.lastVisit().appointmentDate,'d MMMM yyyy, HH:mm') : 'Приёмов пока нет'}">Последний визит</p></div><a th:href="@{/admin/registry/patients/{id}(id=${row.patient.idUser},section='patients')}" class="registry-open">Открыть карточку</a></article><p th:if="${patients.isEmpty()}" class="registry-empty">Пациентов пока нет.</p></div></section>
<section id="doctors" class="registry-panel" data-panel hidden><h2>Врачи</h2><div class="registry-list"><article th:each="row : ${doctors}" class="registry-row"><span class="registry-avatar" th:text="${#strings.substring(row.doctor.firstName,0,1)+#strings.substring(row.doctor.surname,0,1)}">ВР</span><div><h3 th:text="${row.doctor.displayName}">Врач</h3><p th:text="${row.doctor.specialty != null ? row.doctor.specialty.specialtyName : 'Специальность не указана'}">Терапевт</p></div><a th:href="@{/admin/registry/doctors/{id}(id=${row.doctor.idUser},section='doctors')}" class="registry-open">Открыть врача</a></article><p th:if="${doctors.isEmpty()}" class="registry-empty">Врачей пока нет.</p></div></section>
<script th:inline="javascript">(()=>{const initialTab=/*[[${param.tab != null and param.tab[0] == 'doctors' ? 'doctors' : 'patients'}]]*/'patients';const tabs=[...document.querySelectorAll('[data-tab]')],panels=[...document.querySelectorAll('[data-panel]')];const select=tab=>{tabs.forEach(x=>x.dataset.selected=String(x.dataset.tab===tab));panels.forEach(p=>p.hidden=p.id!==tab)};select(initialTab);tabs.forEach(t=>t.addEventListener('click',()=>select(t.dataset.tab)));})();</script>
</main></body></html>
