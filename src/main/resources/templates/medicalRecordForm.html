<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма медицинской записи</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2ff; padding: 40px 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 28px; border: 1px solid #dbeafe; }
        h2 { color: #1e40af; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #374151; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit; }
        textarea { resize: vertical; min-height: 80px; }
        .error { margin-top: 6px; color: #dc2626; font-size: 13px; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; border: none; }
        .btn-save { background: #3b82f6; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
</style>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
    <a th:if="${isDoctor and medicalRecord.appointment != null}" th:href="@{/doctor/patients/{id}(id=${medicalRecord.appointment.user.idUser},appointmentId=${medicalRecord.appointment.idAppointment})}" style="display:inline-block;margin-bottom:14px;color:#087f79;font-weight:700;text-decoration:none">← Вернуться к карте пациента</a>
    <div class="card">
        <h2 th:text="${medicalRecord.idRecord} != null ? 'Редактирование записи' : 'Новая запись'"></h2>
        <form th:action="${medicalRecord.idRecord} != null ? '/medicalRecords/update' : '/medicalRecords/save'" th:object="${medicalRecord}" method="post">
            <input type="hidden" name="id" th:value="${medicalRecord.idRecord}" th:if="${medicalRecord.idRecord != null}">
            <div class="form-group"><label>Диагноз</label><textarea th:field="*{diagnosis}"></textarea><div class="error" th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}"></div></div>
            <div class="form-group"><label>Лечение</label><textarea th:field="*{treatment}"></textarea><div class="error" th:if="${#fields.hasErrors('treatment')}" th:errors="*{treatment}"></div></div>
            <div class="form-group"><label>Рекомендации</label><textarea th:field="*{recommendations}"></textarea><div class="error" th:if="${#fields.hasErrors('recommendations')}" th:errors="*{recommendations}"></div></div>
            <div class="form-group" th:if="${!isDoctor}"><label>Дата создания</label><input type="datetime-local" th:field="*{createdDate}"><div class="error" th:if="${#fields.hasErrors('createdDate')}" th:errors="*{createdDate}"></div></div><p th:if="${isDoctor}" class="form-group" style="color:#61777b;font-size:13px">Дата медицинского итога будет сохранена автоматически.</p>
            <div class="form-group">
                <label>Прием</label>
                <select th:if="${medicalRecord.appointment == null or !isDoctor}" th:field="*{appointment}">
                    <option value="">Выберите приём</option>
                    <option th:each="a : ${appointments}" th:value="${a.idAppointment}" th:text="${#temporals.format(a.appointmentDate, 'dd.MM.yyyy HH:mm') + ' — ' + (a.user != null ? a.user.surname + ' ' + a.user.firstName : 'пациент не указан')}"></option>
                </select>
                <p th:if="${medicalRecord.appointment != null and isDoctor}" th:text="${#temporals.format(medicalRecord.appointment.appointmentDate, 'dd.MM.yyyy HH:mm') + ' — ' + (medicalRecord.appointment.user != null ? medicalRecord.appointment.user.displayName : 'пациент не указан')}" style="padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#f7fbfa;color:#263746"></p>
                <input th:if="${medicalRecord.appointment != null and isDoctor}" type="hidden" th:field="*{appointment}">
                <div class="error" th:if="${#fields.hasErrors('appointment')}" th:errors="*{appointment}"></div>
            </div>
            <div class="btn-group"><button type="submit" class="btn btn-save">Сохранить</button><a th:href="@{/medicalRecords}" class="btn btn-cancel">Отмена</a></div>
        </form>
    </div>
</div>
</body>
</html>
