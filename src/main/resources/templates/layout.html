<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:fragment="portalPage(title, activePage, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5faf9">
    <title th:text="${title + ' · Забота'}">Медцентр «Забота»</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {theme:{extend:{
            colors:{
                clinic:{50:'#e8f7f4',100:'#d3eee9',500:'#0e8f89',600:'#087f79',700:'#08716d'},
                ink:'#112a3d'
            },
            boxShadow:{card:'0 8px 24px rgba(14,143,137,.08)'}
        }}};
    </script>
</head>
<body class="min-h-screen bg-[#f5faf9] text-slate-700 antialiased">
<div class="min-h-screen lg:flex">
    <button id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-slate-950/40 lg:hidden" type="button" aria-label="Закрыть меню"></button>
    <aside id="portal-sidebar" class="fixed inset-y-0 left-0 z-50 flex w-72 -translate-x-full flex-col border-r border-[#dcece9] bg-white transition-transform duration-200 lg:sticky lg:top-0 lg:h-screen lg:w-64 lg:translate-x-0" aria-label="Основное меню">
        <a th:href="@{/}" class="flex h-20 items-center gap-3 border-b border-slate-100 px-6">
            <span class="grid h-[38px] w-[38px] place-items-center rounded-xl bg-clinic-500 text-[23px] font-bold text-white shadow-[0_8px_18px_rgba(14,143,137,.2)]" aria-hidden="true">+</span>
            <span class="font-bold leading-tight text-ink">Забота<small class="mt-1 block text-[10px] font-semibold tracking-[.16em] text-slate-400">МЕДЦЕНТР</small></span>
        </a>

        <nav th:if="${role == 'PATIENT'}" class="flex-1 space-y-1 overflow-y-auto p-4" aria-label="Меню пациента">
            <a th:href="@{/}" th:classappend="${activePage == 'dashboard' ? ' bg-clinic-50 font-semibold text-clinic-700' : ' text-slate-600 hover:bg-slate-50'}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm transition">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg>Главная
            </a>
            <a th:href="@{/appointments}" th:classappend="${activePage == 'appointments' ? ' bg-clinic-50 font-semibold text-clinic-700' : ' text-slate-600 hover:bg-slate-50'}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm transition">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></svg>Записи на приём
            </a>
            <button type="button" data-coming-soon class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm text-slate-500 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg>Медкарта<span class="ml-auto text-[10px] text-slate-400">Скоро</span></button>
            <button type="button" data-coming-soon class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm text-slate-500 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16v16H4zM8 8h8m-8 4h8m-8 4h4"/></svg>Направления<span class="ml-auto text-[10px] text-slate-400">Скоро</span></button>
            <button type="button" data-coming-soon class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm text-slate-500 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Прикрепления<span class="ml-auto text-[10px] text-slate-400">Скоро</span></button>
        </nav>

        <nav th:if="${role == 'DOCTOR'}" class="flex-1 space-y-1 overflow-y-auto p-4" aria-label="Меню врача">
            <a th:href="@{/}" th:classappend="${activePage == 'dashboard' ? ' bg-clinic-50 font-semibold text-clinic-700' : ' text-slate-600 hover:bg-slate-50'}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm transition">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></svg>Главная · расписание
            </a>
            <a href="#my-patients" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m2-11h5m-2.5-2.5v5"/></svg>Мои пациенты</a>
            <a th:href="@{/medicalRecords}" th:classappend="${activePage == 'records' ? ' bg-clinic-50 font-semibold text-clinic-700' : ' text-slate-600 hover:bg-slate-50'}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm transition"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/></svg>Медкарты</a>
            <button type="button" data-coming-soon class="flex w-full items-center gap-3 rounded-xl px-4 py-3 text-left text-sm text-slate-500 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 4h16v16H4zM8 8h8m-8 4h8m-8 4h4"/></svg>Направления<span class="ml-auto text-[10px] text-slate-400">Скоро</span></button>
        </nav>

        <nav th:if="${role == 'ADMIN'}" class="flex-1 space-y-1 overflow-y-auto p-4" aria-label="Меню администратора">
            <a th:href="@{/}" th:classappend="${activePage == 'dashboard' ? ' bg-clinic-50 font-semibold text-clinic-700' : ' text-slate-600 hover:bg-slate-50'}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm transition"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg>Главная</a>
            <a th:href="@{/appointments}" th:classappend="${activePage == 'appointments' ? ' bg-clinic-50 font-semibold text-clinic-700' : ' text-slate-600 hover:bg-slate-50'}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm transition"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18"/></svg>Записи на приём</a>
            <a th:href="@{/users}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m2-11h5m-2.5-2.5v5"/></svg>Пациенты</a>
            <a th:href="@{/users}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21v-2a7 7 0 0 1 14 0v2m2-11h5m-2.5-2.5v5"/></svg>Врачи</a>
            <a th:href="@{/appointments}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Расписание</a>
            <a th:href="@{/services}" class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm text-slate-600 transition hover:bg-clinic-50"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5m-9 4h5m-5 4h5"/></svg>Справки</a>
        </nav>

        <div class="border-t border-slate-100 p-4">
            <div class="mb-3 px-2"><p class="truncate text-sm font-semibold text-ink" th:text="${currentUsername}">Пользователь</p><p class="mt-1 text-xs text-slate-500" th:text="${role}">PATIENT</p></div>
            <form th:action="@{/logout}" method="post"><button type="submit" class="flex w-full items-center justify-center gap-2 rounded-xl border border-slate-200 px-4 py-3 text-sm font-medium text-slate-600 transition hover:border-clinic-100 hover:bg-clinic-50 hover:text-clinic-700"><svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1h-8"/></svg>Выйти</button></form>
        </div>
    </aside>
    <div class="min-w-0 flex-1">
        <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-[#dcece9] bg-white/90 px-4 backdrop-blur sm:px-6 lg:px-10">
            <button id="sidebar-toggle" type="button" class="grid h-10 w-10 place-items-center rounded-xl text-slate-600 hover:bg-clinic-50 lg:hidden" aria-label="Открыть меню" aria-controls="portal-sidebar" aria-expanded="false">
                <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <span class="hidden text-sm text-slate-500 sm:block" th:text="${role == 'ADMIN' ? 'Регистратура' : (role == 'DOCTOR' ? 'Рабочее место врача' : 'Личный кабинет пациента')}">Личный кабинет пациента</span>
            <span class="text-xs font-medium text-clinic-700 sm:hidden">Забота · МЕДЦЕНТР</span>
            <form class="sm:hidden" th:action="@{/logout}" method="post"><button class="rounded-lg px-3 py-2 text-xs font-medium text-slate-500 hover:bg-clinic-50" type="submit">Выйти</button></form>
        </header>
        <main class="mx-auto w-full max-w-6xl px-4 py-7 sm:px-6 sm:py-9 lg:px-10" th:replace="${content}"><!-- Контент страницы --></main>
    </div>
</div>
<div id="coming-soon-message" role="status" aria-live="polite" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] hidden -translate-x-1/2 rounded-xl bg-ink px-5 py-3 text-sm text-white shadow-card">Раздел находится в разработке</div>
<script>
    (() => {
        const sidebar = document.getElementById('portal-sidebar');
        const toggle = document.getElementById('sidebar-toggle');
        const backdrop = document.getElementById('sidebar-backdrop');
        const closeMenu = () => {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
            toggle.setAttribute('aria-expanded', 'false');
        };
        toggle.addEventListener('click', () => {
            const open = toggle.getAttribute('aria-expanded') !== 'true';
            toggle.setAttribute('aria-expanded', String(open));
            sidebar.classList.toggle('-translate-x-full', !open);
            backdrop.classList.toggle('hidden', !open);
        });
        backdrop.addEventListener('click', closeMenu);
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeMenu(); });
        const message = document.getElementById('coming-soon-message');
        document.querySelectorAll('[data-coming-soon]').forEach((item) => item.addEventListener('click', () => {
            message.classList.remove('hidden');
            window.setTimeout(() => message.classList.add('hidden'), 2200);
        }));
    })();
</script>
</body>
</html>
