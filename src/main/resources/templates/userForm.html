<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма пользователя</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Segoe UI", Arial, sans-serif; background: #eef2ff; padding: 40px 20px; }
        .container { max-width: 560px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 28px; border: 1px solid #dbeafe; }
        h2 { color: #1e40af; margin-bottom: 24px; font-size: 20px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #374151; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; background: white; }
        input[type="checkbox"] { width: auto; }
        input:focus, select:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px #bfdbfe; }
        .error { margin-top: 6px; color: #dc2626; font-size: 13px; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; }
        .btn-save { background: #3b82f6; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
</style>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h2 th:text="${user.idUser} != null ? 'Редактирование пользователя' : 'Добавление пользователя'"></h2>
        <div class="error" th:if="${saveError}" th:text="${saveError}"></div>
        <form th:action="${user.idUser} != null ? '/users/update' : '/users/save'" th:object="${user}" method="post">
            <input type="hidden" name="id" th:value="${user.idUser}" th:if="${user.idUser} != null">

            <div class="form-group"><label>Логин</label><input type="text" th:field="*{username}"><div class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div></div>
            <div class="form-group"><label>Фамилия</label><input type="text" th:field="*{surname}"><div class="error" th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}"></div></div>
            <div class="form-group"><label>Имя</label><input type="text" th:field="*{firstName}"><div class="error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div></div>
            <div class="form-group"><label>Отчество</label><input type="text" th:field="*{middleName}"><div class="error" th:if="${#fields.hasErrors('middleName')}" th:errors="*{middleName}"></div></div>
            <div class="form-group"><label>Email</label><input type="email" th:field="*{email}"><div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div></div>
            <div class="form-group"><label>Телефон</label><input type="text" th:field="*{phone}" placeholder="+79001112233"><div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div></div>
            <div class="form-group"><label>Пароль</label><input type="password" th:field="*{password}"><div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div></div>
            <div class="form-group"><label><input type="checkbox" th:field="*{active}"> Активен</label></div>

            <div class="form-group">
                <label>Отделение</label>
                <select th:field="*{department}">
                    <option value="">Выберите отделение</option>
                    <option th:each="department : ${departments}" th:value="${department.idDepartment}" th:text="${department.departmentName}"></option>
                </select>
            </div>

            <div class="form-group">
                <label>Специальность</label>
                <select th:field="*{specialty}">
                    <option value="">Выберите специальность</option>
                    <option th:each="specialty : ${specialties}" th:value="${specialty.idSpecialty}" th:text="${specialty.specialtyName}"></option>
                </select>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-save">Сохранить</button>
                <a th:href="@{/users}" class="btn btn-cancel">Отмена</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
