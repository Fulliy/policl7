<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: portalPage('Филиалы клиники', 'clinic-catalog', ~{::content})}">
<body>
<main th:fragment="content" class="clinic-catalog-page space-y-6">
    <style>
        .clinic-catalog-page{--c-ink:#163640;--c-muted:#526978;--c-line:#dcebe7;--c-teal:#087f79;max-width:1020px;margin:0 auto}
        .clinic-catalog-page .catalog-hero{padding:28px 32px;border-radius:22px;color:#fff;background:#163e48}
        .clinic-catalog-page .catalog-hero h1{margin:0;color:#fff!important;font-size:clamp(2rem,4vw,2.7rem);line-height:1.08}
        .clinic-catalog-page .catalog-panel{padding:22px;border:1px solid var(--c-line);border-radius:18px;background:#fff;box-shadow:0 8px 22px rgba(22,62,72,.06)}
        .clinic-catalog-page .catalog-panel h2{margin:0;color:var(--c-ink)!important;font-size:21px}
        .clinic-catalog-page .catalog-search{display:block;width:100%;min-height:50px;margin-top:16px;padding:11px 14px;border:1px solid #bcd9d4;border-radius:10px;font:inherit;font-size:16px}
        .clinic-catalog-page .catalog-add{margin-top:16px}
        .clinic-catalog-page .catalog-add summary{display:flex;min-height:54px;align-items:center;justify-content:center;padding:12px 17px;border:2px solid var(--c-teal);border-radius:11px;color:#fff;background:var(--c-teal);font-size:16px;font-weight:800;cursor:pointer;list-style:none}
        .clinic-catalog-page .catalog-add summary::-webkit-details-marker{display:none}
        .clinic-catalog-page .catalog-add summary::before{content:'＋';margin-right:9px;font-size:21px}
        .clinic-catalog-page .catalog-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:16px;padding:18px;border:1px solid var(--c-line);border-radius:14px;background:#f9fcfb}
        .clinic-catalog-page .catalog-fields label{color:#284e55;font-size:15px;font-weight:700}
        .clinic-catalog-page .catalog-fields input,.clinic-catalog-page .catalog-fields select{display:block;width:100%;min-height:48px;margin-top:6px;padding:10px 12px;border:1px solid #bdd8d3;border-radius:9px;background:#fff;font:inherit}
        .clinic-catalog-page .catalog-fields select[multiple]{min-height:120px}
        .clinic-catalog-page .catalog-save{grid-column:1/-1;min-height:52px;border:0;border-radius:10px;color:#fff;background:#087f79;font:inherit;font-size:16px;font-weight:800;cursor:pointer}
        .clinic-catalog-page .catalog-list{display:grid;gap:13px;margin-top:18px}
        .clinic-catalog-page .catalog-item{padding:18px;border:1px solid var(--c-line);border-radius:14px;background:#fff}
        .clinic-catalog-page .catalog-item h3{margin:0 0 12px;color:var(--c-ink);font-size:17px}
        .clinic-catalog-page .catalog-edit{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
        .clinic-catalog-page .catalog-edit label{color:#284e55;font-size:14px;font-weight:700}
        .clinic-catalog-page .catalog-edit input,.clinic-catalog-page .catalog-edit select{display:block;width:100%;min-height:46px;margin-top:5px;padding:9px 11px;border:1px solid #bdd8d3;border-radius:9px;background:#fff;font:inherit}
        .clinic-catalog-page .catalog-edit select[multiple]{min-height:104px}
        .clinic-catalog-page .catalog-edit button{grid-column:1/-1;min-height:50px;border:2px solid #a3d3cb;border-radius:10px;color:#075e5a;background:#edf8f5;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
        .clinic-catalog-page .catalog-empty{padding:20px;border:1px dashed #b8d7d1;border-radius:12px;color:var(--c-muted);font-size:15px;text-align:center}
        .clinic-catalog-page button:focus-visible,.clinic-catalog-page input:focus-visible,.clinic-catalog-page select:focus-visible,.clinic-catalog-page summary:focus-visible{outline:4px solid #087f7950;outline-offset:2px}
        @media(max-width:680px){.clinic-catalog-page .catalog-hero{padding:23px 20px}.clinic-catalog-page .catalog-panel{padding:17px}.clinic-catalog-page .catalog-fields,.clinic-catalog-page .catalog-edit{grid-template-columns:1fr}.clinic-catalog-page .catalog-save,.clinic-catalog-page .catalog-edit button{grid-column:auto}}
    </style>
    <header class="catalog-hero"><h1>Филиалы клиники</h1></header>
    <section class="catalog-panel">
        <h2>Филиалы и адреса</h2>
        <label class="sr-only" for="branchSearch">Поиск филиала</label>
        <input id="branchSearch" class="catalog-search" type="search" data-search="branches" placeholder="Поиск по названию, адресу или врачу">
        <details class="catalog-add"><summary>Добавить филиал</summary><div>
            <form th:action="@{/admin/clinic-catalog/branches/save}" method="post" class="catalog-fields">
                <label>Название филиала<input name="name" required maxlength="120"></label>
                <label>Адрес<input name="address" required maxlength="255"></label>
                <label>Телефон<input name="phone" maxlength="30"></label>
                <label>Врачи филиала<select name="doctorIds" multiple size="4"><option th:each="doctor : ${doctors}" th:value="${doctor.idUser}" th:text="${doctor.displayName}"></option></select></label>
                <button class="catalog-save" type="submit">Сохранить филиал</button>
            </form>
        </div></details>
        <div id="branchList" class="catalog-list">
            <article class="catalog-item" th:each="branch : ${branches}" th:attr="data-search-text=${branch.name + ' ' + branch.address + ' ' + #strings.listJoin(branch.doctors.![displayName], ' ')}">
                <h3 th:text="${branch.name}">Филиал</h3>
                <form th:action="@{/admin/clinic-catalog/branches/save}" method="post" class="catalog-edit">
                    <input type="hidden" name="id" th:value="${branch.id}">
                    <label>Название<input name="name" required th:value="${branch.name}"></label>
                    <label>Адрес<input name="address" required th:value="${branch.address}"></label>
                    <label>Телефон<input name="phone" th:value="${branch.phone}"></label>
                    <label>Врачи филиала<select name="doctorIds" multiple size="4"><option th:each="doctor : ${doctors}" th:value="${doctor.idUser}" th:selected="${doctor.branches != null and #lists.contains(doctor.branches.![id], branch.id)}" th:text="${doctor.displayName}"></option></select></label>
                    <button type="submit">Сохранить изменения филиала</button>
                </form>
            </article>
            <p th:if="${branches.isEmpty()}" class="catalog-empty">Филиалов пока нет. Нажмите «Добавить филиал».</p>
            <p id="branchSearchEmpty" class="catalog-empty" hidden>По этому запросу филиалы не найдены.</p>
        </div>
    </section>
    <script>
        (()=>{const input=document.querySelector('[data-search="branches"]'),rows=[...document.querySelectorAll('#branchList [data-search-text]')],empty=document.getElementById('branchSearchEmpty');input?.addEventListener('input',()=>{const q=input.value.trim().toLocaleLowerCase('ru');let count=0;rows.forEach(row=>{row.hidden=!row.dataset.searchText.toLocaleLowerCase('ru').includes(q);if(!row.hidden)count++;});empty.hidden=count!==0||!q;});})();
    </script>
</main>
</body>
</html>
