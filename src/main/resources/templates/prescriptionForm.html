<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма назначения</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #eef2ff; padding: 40px 20px; }
        .container { max-width: 520px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; padding: 28px; border: 1px solid #dbeafe; }
        h2 { color: #1e40af; margin-bottom: 24px; text-align: center; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; color: #374151; }
        input, select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
        .error { margin-top: 6px; color: #dc2626; font-size: 13px; }
        .btn-group { display: flex; gap: 12px; margin-top: 24px; }
        .btn { flex: 1; padding: 10px; border-radius: 8px; font-size: 14px; cursor: pointer; text-align: center; text-decoration: none; border: none; }
        .btn-save { background: #3b82f6; color: white; }
        .btn-cancel { background: #9ca3af; color: white; }
</style>
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="container">
    <div class="card">
        <h2 th:text="${prescription.idPrescription} != null ? 'Редактирование назначения' : 'Новое назначение'"></h2>
        <form th:action="${prescription.idPrescription} != null ? '/prescriptions/update' : '/prescriptions/save'" th:object="${prescription}" method="post">
            <input type="hidden" name="id" th:value="${prescription.idPrescription}" th:if="${prescription.idPrescription != null}">
            <div class="form-group"><label>Лекарство</label><input type="text" th:field="*{medicationName}"><div class="error" th:if="${#fields.hasErrors('medicationName')}" th:errors="*{medicationName}"></div></div>
            <div class="form-group"><label>Дозировка</label><input type="text" th:field="*{dosage}"><div class="error" th:if="${#fields.hasErrors('dosage')}" th:errors="*{dosage}"></div></div>
            <div class="form-group"><label>Частота</label><input type="text" th:field="*{frequency}"><div class="error" th:if="${#fields.hasErrors('frequency')}" th:errors="*{frequency}"></div></div>
            <div class="form-group"><label>Длительность, дней</label><input type="number" th:field="*{durationDays}"><div class="error" th:if="${#fields.hasErrors('durationDays')}" th:errors="*{durationDays}"></div></div>
            <div class="form-group">
                <label>Медицинская запись</label>
                <select th:if="${!isDoctor or prescription.medicalRecord == null}" th:field="*{medicalRecord}">
                    <option value="">Выберите запись</option>
                    <option th:each="r : ${medicalRecords}" th:value="${r.idRecord}" th:text="${r.idRecord} + ' - ' + ${r.diagnosis}"></option>
                </select>
                <p th:if="${isDoctor and prescription.medicalRecord != null}"
                   th:text="${prescription.medicalRecord.idRecord + ' — ' + prescription.medicalRecord.diagnosis}"
                   style="padding:10px 12px;border:1px solid #d1d5db;border-radius:8px;background:#f7fbfa;color:#263746"></p>
                <input th:if="${isDoctor and prescription.medicalRecord != null}" type="hidden" th:field="*{medicalRecord}">
                <div class="error" th:if="${#fields.hasErrors('medicalRecord')}" th:errors="*{medicalRecord}"></div>
            </div>
            <div class="form-group">
                <label>Услуга</label>
                <select th:field="*{service}">
                    <option value="">Выберите услугу</option>
                    <option th:each="s : ${services}" th:value="${s.idService}" th:text="${s.serviceName}"></option>
                </select>
                <div class="error" th:if="${#fields.hasErrors('service')}" th:errors="*{service}"></div>
            </div>
            <div class="btn-group"><button type="submit" class="btn btn-save">Сохранить</button><a th:href="@{/prescriptions}" class="btn btn-cancel">Отмена</a></div>
        </form>
    </div>
</div>
</body>
</html>
