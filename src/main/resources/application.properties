spring.datasource.url=${MEDICAL_DB_URL:jdbc:postgresql://localhost:5433/policl}
spring.datasource.username=${MEDICAL_DB_USERNAME:postgres}
spring.datasource.password=${MEDICAL_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${MEDICAL_JPA_DDL_AUTO:validate}

spring.jpa.show-sql=true
spring.jpa.database=POSTGRESQL
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Keep the legacy default session store unchanged. The cloud profile opts into
# the shared JDBC session repository after its schema has been prepared.
spring.session.store-type=none
app.demo-data.enabled=false

